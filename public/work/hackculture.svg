<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900">
  <rect width="1200" height="900" fill="#0f112e"/>
  <circle cx="200" cy="220" r="260" fill="#3226d9" opacity="0.5"/>
  <circle cx="1020" cy="700" r="220" fill="#ff5a5f" opacity="0.3"/>
  
  <!-- Terminal / Code Editor Window -->
  <rect x="180" y="140" width="840" height="520" rx="24" fill="#080a1c" stroke="#252b66" stroke-width="3"/>
  
  <!-- Terminal Window Bar -->
  <rect x="180" y="140" width="840" height="46" rx="24" fill="#141838"/>
  <circle cx="215" cy="163" r="7" fill="#ff5f56"/>
  <circle cx="238" cy="163" r="7" fill="#ffbd2e"/>
  <circle cx="261" cy="163" r="7" fill="#27c93f"/>
  <text x="500" y="168" font-family="monospace" font-size="14" fill="#8892b0">hackculture-engine // sprint-04</text>
  
  <!-- Terminal Content (Left: Code & Matching) -->
  <g transform="translate(220, 220)">
    <!-- Code lines -->
    <rect x="0" y="0" width="220" height="16" rx="4" fill="#a78bfa" opacity="0.8"/>
    <rect x="0" y="28" width="340" height="16" rx="4" fill="#60a5fa" opacity="0.7"/>
    <rect x="30" y="56" width="260" height="16" rx="4" fill="#34d399" opacity="0.8"/>
    <rect x="30" y="84" width="180" height="16" rx="4" fill="#f472b6" opacity="0.7"/>
    <rect x="0" y="112" width="120" height="16" rx="4" fill="#a78bfa" opacity="0.8"/>
    
    <!-- Code Brackets Illustration -->
    <g transform="translate(50, 160)" stroke="#ffa12e" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 50 20 L 10 70 L 50 120"/>
      <path d="M 130 20 L 170 70 L 130 120"/>
      <path d="M 105 10 L 75 130"/>
    </g>
  </g>
  
  <!-- Radar / Team Matching Matrix Visual (Right) -->
  <g transform="translate(640, 230)">
    <rect x="0" y="0" width="340" height="380" rx="16" fill="#111638"/>
    <text x="25" y="36" font-family="system-ui, sans-serif" font-weight="700" font-size="16" fill="#f3f4ea">Automated Team Matrix</text>
    
    <!-- Radar concentric polygons -->
    <polygon points="170,80 260,140 230,240 110,240 80,140" fill="none" stroke="#252b66" stroke-width="2"/>
    <polygon points="170,110 230,150 210,220 130,220 110,150" fill="none" stroke="#3226d9" stroke-width="2"/>
    <polygon points="170,120 220,160 190,210 140,210 120,160" fill="rgba(255, 161, 46, 0.35)" stroke="#ffa12e" stroke-width="3"/>
    
    <!-- Live Leaderboard Ticker -->
    <g transform="translate(25, 270)">
      <rect x="0" y="0" width="290" height="34" rx="8" fill="#1b2252"/>
      <circle cx="20" cy="17" r="8" fill="#ffa12e"/>
      <rect x="38" y="11" width="120" height="12" rx="4" fill="#f3f4ea"/>
      <text x="225" y="22" font-family="monospace" font-size="13" font-weight="700" fill="#34d399">98.4 pts</text>
      
      <rect x="0" y="44" width="290" height="34" rx="8" fill="#161c45"/>
      <circle cx="20" cy="61" r="8" fill="#a78bfa"/>
      <rect x="38" y="55" width="100" height="12" rx="4" fill="#f3f4ea" opacity="0.8"/>
      <text x="225" y="66" font-family="monospace" font-size="13" font-weight="700" fill="#34d399">94.1 pts</text>
    </g>
  </g>
  
  <!-- Floating Badge: Devnovate Model -->
  <g transform="translate(130, 480)">
    <rect width="210" height="110" rx="18" fill="#3226d9" stroke="#5d4ef5" stroke-width="2" filter="drop-shadow(0 15px 30px rgba(0,0,0,0.5))"/>
    <text x="22" y="38" font-family="system-ui, sans-serif" font-weight="800" font-size="16" fill="#f3f4ea">Devnovate Replica</text>
    <text x="22" y="68" font-family="system-ui, sans-serif" font-weight="700" font-size="22" fill="#ffa12e">2,500+ Devs</text>
    <rect x="22" y="82" width="115" height="16" rx="8" fill="#111638"/>
    <text x="32" y="94" font-family="monospace" font-size="10" font-weight="700" fill="#34d399">ACTIVE SPRINTS</text>
  </g>
  
  <!-- Bottom bar -->
  <rect y="780" width="1200" height="120" fill="#090b1c"/>
  <rect x="460" y="820" width="280" height="12" rx="6" fill="#252b66"/>
</svg>
