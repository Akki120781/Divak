<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900">
  <rect width="1200" height="900" fill="#241315"/>
  <circle cx="950" cy="220" r="250" fill="#e55934" opacity="0.45"/>
  <circle cx="180" cy="720" r="220" fill="#ffa12e" opacity="0.35"/>
  
  <!-- Central Studio Monitor Frame -->
  <rect x="200" y="140" width="800" height="520" rx="28" fill="#140a0b" stroke="#4a2226" stroke-width="3"/>
  
  <!-- Camera / Optical Lens Rig -->
  <g transform="translate(320, 240)">
    <!-- Outer Lens Barrel -->
    <circle cx="160" cy="160" r="140" fill="#1e1012" stroke="#5c2b30" stroke-width="6"/>
    <circle cx="160" cy="160" r="115" fill="#2d171b" stroke="#ffa12e" stroke-width="3"/>
    <circle cx="160" cy="160" r="85" fill="#140a0b"/>
    <!-- Glass Reflections -->
    <path d="M 95 110 A 115 115 0 0 1 225 110" stroke="#f3f4ea" stroke-width="6" stroke-linecap="round" opacity="0.6" fill="none"/>
    <circle cx="160" cy="160" r="45" fill="#e55934" opacity="0.85"/>
    <circle cx="175" cy="145" r="14" fill="#ffffff" opacity="0.7"/>
  </g>
  
  <!-- Shure Microphone Silhouette (Right) -->
  <g transform="translate(700, 240)">
    <!-- Mic Body -->
    <rect x="30" y="60" width="90" height="180" rx="45" fill="#2d171b" stroke="#5c2b30" stroke-width="4"/>
    <rect x="42" y="90" width="66" height="70" rx="10" fill="#140a0b"/>
    <line x1="45" y1="110" x2="105" y2="110" stroke="#5c2b30" stroke-width="2"/>
    <line x1="45" y1="125" x2="105" y2="125" stroke="#5c2b30" stroke-width="2"/>
    <line x1="45" y1="140" x2="105" y2="140" stroke="#5c2b30" stroke-width="2"/>
    
    <!-- Mic Mount -->
    <path d="M 15 150 C 15 260, 135 260, 135 150" fill="none" stroke="#ffa12e" stroke-width="6" stroke-linecap="round"/>
    <rect x="70" y="260" width="10" height="70" fill="#ffa12e"/>
  </g>
  
  <!-- Audio Waveform Visualizer Bar -->
  <g transform="translate(250, 560)">
    <rect x="0" y="20" width="10" height="30" rx="5" fill="#ffa12e"/>
    <rect x="20" y="10" width="10" height="50" rx="5" fill="#e55934"/>
    <rect x="40" y="0" width="10" height="70" rx="5" fill="#ffa12e"/>
    <rect x="60" y="15" width="10" height="40" rx="5" fill="#ffffff"/>
    <rect x="80" y="5" width="10" height="60" rx="5" fill="#e55934"/>
    <rect x="100" y="18" width="10" height="34" rx="5" fill="#ffa12e"/>
    <rect x="120" y="2" width="10" height="66" rx="5" fill="#ffffff"/>
    <rect x="140" y="12" width="10" height="46" rx="5" fill="#e55934"/>
    <rect x="160" y="22" width="10" height="26" rx="5" fill="#ffa12e"/>
    <rect x="180" y="8" width="10" height="54" rx="5" fill="#ffffff"/>
    <rect x="200" y="18" width="10" height="34" rx="5" fill="#e55934"/>
  </g>
  
  <!-- REC Badge Top Left of Monitor -->
  <g transform="translate(240, 175)">
    <circle cx="12" cy="12" r="8" fill="#e55934"/>
    <text x="32" y="18" font-family="monospace" font-size="16" font-weight="700" fill="#f3f4ea">REC 4K PRORES // 24 FPS</text>
  </g>
  
  <!-- Floating Badge: Khud Ka Production -->
  <g transform="translate(130, 470)">
    <rect width="220" height="120" rx="18" fill="#e55934" stroke="#ff7d59" stroke-width="2" filter="drop-shadow(0 15px 30px rgba(0,0,0,0.5))"/>
    <text x="22" y="38" font-family="system-ui, sans-serif" font-weight="800" font-size="16" fill="#140a0b">Khud Ka Studio</text>
    <text x="22" y="70" font-family="system-ui, sans-serif" font-weight="700" font-size="24" fill="#ffffff">18M+ Views</text>
    <rect x="22" y="86" width="130" height="18" rx="9" fill="#140a0b"/>
    <text x="32" y="99" font-family="monospace" font-size="10" font-weight="700" fill="#ffa12e">CREATOR ESCROW</text>
  </g>
  
  <!-- Bottom Base -->
  <rect y="780" width="1200" height="120" fill="#140a0b"/>
  <rect x="470" y="820" width="260" height="12" rx="6" fill="#4a2226"/>
</svg>
